<!doctype html>
<html><head><meta charset="utf-8"><title>GeoSafe Guardian Dashboard</title>
<style>body{font-family:Arial;margin:30px;background:#f7f4fb}h1{color:#4f3b7a}.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}.danger{font-weight:bold}</style>
</head><body>
<h1>🛡️ GeoSafe Guardian Dashboard</h1>
<div class="card"><b>Live emergency alerts</b><div id="alerts">Loading...</div></div>
<div class="card"><b>Recent telemetry</b><div id="telemetry">Loading...</div></div>
<script>
async function refresh(){
 const a=await fetch('/api/alerts').then(r=>r.json());
 document.getElementById('alerts').innerHTML=a.length?a.map(x=>`<div class="card danger">🚨 ${x.hr||'-'} BPM<br>Location: ${x.lat||'-'}, ${x.lon||'-'}<br>${x.receivedAt}</div>`).join(''):'No alerts';
 const t=await fetch('/api/telemetry').then(r=>r.json());
 document.getElementById('telemetry').innerHTML=t.slice(0,20).map(x=>`<div>❤️ ${x.hr||'-'} BPM &nbsp; 📍 ${x.lat||'-'}, ${x.lon||'-'} &nbsp; ${x.receivedAt}</div>`).join('');
}
refresh(); setInterval(refresh,3000);
</script></body></html>
